<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Listado de Actividades Sexuales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}" />
    <style>
        table td {
            padding: 12px 15px;
            vertical-align: top;
            white-space: normal;
            word-wrap: break-word;
            max-width: 200px;
        }
    </style>
</head>
<body>
<div th:insert="fragments/header :: header">...</div>     
<div class="container mt-5">
    <h2 class="text-center">Listado de Actividades Sexuales</h2>
    

    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>Paciente</th>
                <th>Fecha</th>
                <th>Protección</th>
                <th>Frecuencia</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="actividad : ${actividadesSexuales}">
                <td th:text="${actividad.paciente != null ? actividad.paciente.nombreCompleto : 'Sin paciente'}">Paciente</td>
                <td th:text="${actividad.fecha}">Fecha</td>
                <td th:text="${actividad.usoProteccion != null ? (actividad.usoProteccion ? 'Sí' : 'No') : 'Sin info'}">Protección</td>
                <td th:text="${actividad.frecuencia}">Frecuencia</td>
                <td>
                    <a th:href="@{'/actividad-sexual/editar/' + ${actividad.id}}" class="btn btn-sm btn-warning">
                        <span class="glyphicon glyphicon-pencil"></span> Editar
                    </a>
                    <a th:href="@{'/actividad-sexual/eliminar/' + ${actividad.id}}" class="btn btn-sm btn-danger" 
                       onclick="return confirm('¿Estás seguro de eliminar esta actividad?');">
                        <span class="glyphicon glyphicon-trash"></span> Eliminar
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
