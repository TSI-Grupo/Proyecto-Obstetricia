<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<title>Registro de usuarios</title>
<!-- Bootstrap CSS -->
<link rel="stylesheet"
	href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
	integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
	crossorigin="anonymous">
<link rel="stylesheet"
	href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap-theme.min.css"
	integrity="sha384-rHyoN1iRsVXV4nD0JutlnGaslCJuC7uwjduW9SVrLvRYooPp2bWYgmgJQIXwl/Sp"
	crossorigin="anonymous">
<link rel="stylesheet" type="text/css" th:href="@{/css/style.css}" />
</head>
<body>
<div th:insert="fragments/header :: header">...</div>

	<br><br>

	<div class="container">
		<div class="row">
			<div class="col-md-6 col-md-offset-3">
				<div th:if=${param.exito}>
					<div class="alert alert-info">Se ha registrado exitosamente a la aplicación</div>
				</div>
				<div th:if="${param.error}">
					<div class="alert alert-danger">
						El correo electrónico ya está registrado. Intenta con otro.
					</div>
				</div>

				<h1>Ingrese los datos solicitados</h1>
				<form th:action="@{/registro}" method="post" th:object="${usuario}" onsubmit="return validarFormulario()">
					<div class="form-group">
						<label class="control-label" for="nombre">Nombres : </label> 
						<input id="nombre" type="text" class="form-control" th:field="*{nombre}" required autofocus="autofocus">
					</div>

					<div class="form-group">
						<label class="control-label" for="apellido">Apellidos : </label> 
						<input id="apellido" type="text" class="form-control" th:field="*{apellido}" required>
					</div>

					<div class="form-group">
						<label class="control-label" for="email">Correo  : </label> 
						<input id="email" type="email" class="form-control" th:field="*{email}" required>
					</div>

					<div class="form-group">
						<label class="control-label" for="password">Contraseña : </label> 
						<input type="password" id="password" class="form-control" th:field="*{password}" required>
					</div>

					<div class="form-group">
						<button type="submit" class="btn btn-success">Registrar</button>
						<span>Si estás registrad@ <a th:href="@{/login}">inicia sesión aquí</a></span>
					</div>
				</form>
			</div>
		</div>
	</div>

	<!-- Validación con JavaScript -->
	<script>
		function validarFormulario() {
			const nombre = document.getElementById('nombre').value.trim();
			const apellido = document.getElementById('apellido').value.trim();
			const email = document.getElementById('email').value.trim();

			const soloLetras = /^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$/;
			const correoSinNumerosAntesDelArroba = /^[^\d]+@[a-zA-Z]+\.[a-zA-Z]{2,}$/;

			if (!soloLetras.test(nombre)) {
				alert("El campo 'Nombres' solo debe contener letras.");
				return false;
			}
			if (!soloLetras.test(apellido)) {
				alert("El campo 'Apellidos' solo debe contener letras.");
				return false;
			}
			if (!correoSinNumerosAntesDelArroba.test(email)) {
				alert("El correo no debe contener números antes del '@' y debe tener un formato válido.");
				return false;
			}

			return true;
		}
	</script>

	<!-- Bootstrap JS -->
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"
		integrity="sha384-Tc5IQib027qvyjSMfHjOMaLkfuWVxZxUPnCJA7l2mCWNIpG9mGCD8wGNIcPD7Txa"
		crossorigin="anonymous"></script>
</body>
</html>
