<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Listado de Controles de Embarazo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}" />
    <style>
        table td {
            padding: 12px 15px;
            vertical-align: top;
            white-space: normal;
            word-wrap: break-word;
            max-width: 200px;
        }
    </style>
</head>
<body>
<div th:insert="fragments/header :: header">...</div>  
<div class="container mt-5">
    <h2 class="text-center ">Listado de Controles de Embarazo</h2>

    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Paciente</th>
                <th>Último Día de Menstruación</th>
                <th>Semanas</th>
                <th>Trimestre</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="embarazo, iterStat : ${embarazos}">
                <td th:text="${iterStat.count}">1</td>
                <td th:text="${embarazo.paciente != null ? embarazo.paciente.nombreCompleto : 'Sin paciente'}">Paciente</td>
                <td th:text="${embarazo.ultimoDiaMenstruacion}">2025-05-23</td>
                <td th:text="${embarazo.semanas}">12</td>
                <td th:text="${embarazo.trimestre}">1</td>
                <td>
                    <a th:href="@{'/embarazo/editar/' + ${embarazo.id}}" class="btn btn-sm btn-warning me-1">
                        <span class="bi bi-pencil-fill"></span> Editar
                    </a>
                    <a th:href="@{'/embarazo/eliminar/' + ${embarazo.id}}" class="btn btn-sm btn-danger"
                       onclick="return confirm('¿Estás seguro de eliminar este control de embarazo?');">
                        <span class="bi bi-trash-fill"></span> Eliminar
                    </a>
                </td>
            </tr>
            <tr th:if="${embarazos == null or #lists.isEmpty(embarazos)}">
                <td colspan="6" class="text-center">No hay controles de embarazo registrados.</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Bootstrap Icons CDN (opcional, para iconos) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

</body>
</html>
