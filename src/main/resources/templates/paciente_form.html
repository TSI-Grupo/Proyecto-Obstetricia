<!-- templates/paciente_form.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Ingreso de Paciente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}" />
</head>

<body>
    <div th:insert="fragments/header :: header">...</div>
    <div class="container mt-5">
        <h2>Ingreso de Datos del Paciente</h2>
        <form th:action="@{/pacientes/save}" th:object="${paciente}" method="post" class="row g-3">
            <input type="hidden" th:field="*{id}">

            <div class="col-md-6">
                <label for="nombreCompleto" class="form-label">Nombre Completo</label>
                <input type="text" class="form-control" id="nombreCompleto" th:field="*{nombreCompleto}" required>
            </div>

            <div class="col-md-3">
                <label for="fechaNacimiento" class="form-label">Fecha de Nacimiento</label>
                <input type="date" class="form-control" id="fechaNacimiento" th:field="*{fechaNacimiento}" th:attr="min=${minNacimiento}, max=${maxNacimiento}" required>
            </div>

            <div class="col-md-3">
                <label for="sexo" class="form-label">Sexo</label>
                <select class="form-select" id="sexo" th:field="*{sexo}" required>
                    <option value="">Seleccione...</option>
                    <option value="Femenino">Femenino</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>

            <div class="col-md-4">
                <label for="region" class="form-label">Región</label>
                <input type="text" class="form-control" id="region" th:field="*{region}" required>
            </div>

            <div class="col-md-4">
                <label for="ciudad" class="form-label">Ciudad</label>
                <input type="text" class="form-control" id="ciudad" th:field="*{ciudad}" required>
            </div>

            <div class="col-md-4">
                <label for="direccion" class="form-label">Dirección</label>
                <input type="text" class="form-control" id="direccion" th:field="*{direccion}" required>
            </div>

            <div class="col-md-4">
                <label for="rut" class="form-label">RUT</label>
                <input type="text" class="form-control" id="rut" th:field="*{rut}" required>
            </div>

            <div class="col-md-4">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="text" class="form-control" id="telefono" th:field="*{telefono}" required>
            </div>

            <div class="col-md-4">
                <label for="correo" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="correo" th:field="*{correo}" required>
            </div>

            <div class="col-12">
                <button type="submit" class="btn btn-primary">Guardar Paciente</button>
            </div>
        </form>
    </div>
</body>

</html>
