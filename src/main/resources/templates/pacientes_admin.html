<!-- templates/pacientes_admin.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Administrar Pacientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/style.css}" />
    <style>
        table td {
            padding: 12px 15px;
            vertical-align: top;
            white-space: normal;
            word-wrap: break-word;
            max-width: 200px;
        }
    </style>
</head>
<body>
<div th:insert="fragments/header :: header">...</div>
<div class="container mt-5">
    
    <h2 class="text-center" style="margin-bottom: 20px;">Lista de Pacientes</h2>
    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>Nombre</th>
            <th>Edad</th>
            <th>Sexo</th>
            <th>Región</th>
            <th>Ciudad</th>
            <th>RUT</th>
            <th>Teléfono</th>
            <th>Correo</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="paciente : ${pacientes}">
            <td th:text="${paciente.nombreCompleto}">Nombre</td>
            <td th:text="${paciente.edad}"></td>
            <td th:text="${paciente.sexo}">Sexo</td>
            <td th:text="${paciente.region}">Región</td>
            <td th:text="${paciente.ciudad}">Ciudad</td>
            <td th:text="${paciente.rut}">RUT</td>
            <td th:text="${paciente.telefono}">Teléfono</td>
            <td th:text="${paciente.correo}">Correo</td>
            <td>
                <a th:href="@{/pacientes/edit/{id}(id=${paciente.id})}" class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{/pacientes/delete/{id}(id=${paciente.id})}" class="btn btn-sm btn-danger"
                   onclick="return confirm('¿Está seguro que desea eliminar este paciente?');">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
