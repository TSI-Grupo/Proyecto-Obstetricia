<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar Actividad Sexual</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <div class="row">
        <div class="col-md-8 col-md-offset-2">
            <div class="panel panel-info">
                <div class="panel-heading">
                    <h3 class="panel-title">Registro de Actividad Sexual para <span th:text="${actividadSexual.paciente.nombreCompleto}">Nombre del Paciente</span>
                    </h3>
                </div>
                <div class="panel-body">
                    <form th:action="@{/actividad-sexual/guardar}" method="post">
                        <input type="hidden" name="rutPaciente" th:value="${rutPaciente}">
                        <div class="form-group">
                            <label for="fecha">Fecha de la actividad:</label>
                            <input type="date" id="fecha" name="fecha" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="proteccion">¿Se usó protección?</label>
                            <select id="proteccion" name="proteccion" class="form-control" required>
                                <option value="">Seleccione</option>
                                <option value="SI">Sí</option>
                                <option value="NO">No</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="frecuencia">Frecuencia:</label>
                            <select id="frecuencia" name="frecuencia" class="form-control" required>
                                <option value="">Seleccione</option>
                                <option value="OCASIONAL">Ocasional</option>
                                <option value="REGULAR">Regular</option>
                                <option value="FRECUENTE">Frecuente</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Guardar Actividad</button>
                    </form>
                </div>
            </div>
            <div class="alert alert-info">
                <strong>Sugerencia:</strong> Recuerda que el uso correcto del preservativo incluye:
                <ul>
                    <li>Revisar la fecha de vencimiento</li>
                    <li>Usar uno nuevo en cada relación</li>
                    <li>Guardar en lugar fresco (no billetera ni bolsillo)</li>
                </ul>
            </div>
        </div>
    </div>
</div>
</body>
</html>
