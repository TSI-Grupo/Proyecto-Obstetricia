<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listado de Ingestas Anticonceptivas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-info text-white">
            Listado de Ingestas Anticonceptivas
        </div>

        <div class="card-body">
            <!-- Mensaje Flash -->
            <div th:if="${mensaje}" class="alert alert-info" th:text="${mensaje}"></div>

            <table class="table table-bordered table-hover">
                <thead class="table-light">
                    <tr>
                        <th>Paciente</th>
                        <th>Fecha</th>
                        <th>Olvidó la pastilla</th>
                        <th>Efectos adversos</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="ingesta : ${ingestas}">
                        <td th:text="${ingesta.paciente != null ? ingesta.paciente.nombreCompleto : 'Sin paciente'}">Paciente</td>
                        <td th:text="${ingesta.fecha}">2024-01-01</td>
                        <td th:text="${ingesta.olvidada ? 'Sí' : 'No'}">No</td>
                        <td th:text="${ingesta.efectosAdversos}">Sin efectos</td>

                        <td>
                            <a th:href="@{'/anticonceptivos/editar/' + ${ingesta.id}}" class="btn btn-sm btn-warning me-1">
                                <span class="bi bi-pencil-fill"></span> Editar
                            </a>
                            <a th:href="@{'/anticonceptivos/eliminar/' + ${ingesta.id}}" class="btn btn-sm btn-danger"
                                onclick="return confirm('¿Estás seguro de eliminar esta ingesta anticonceptiva?');">
                                <span class="bi bi-trash-fill"></span> Eliminar
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <a href="/anticonceptivos/validar-rut" class="btn btn-secondary">Registrar Nueva Ingesta</a>
            <a th:href="@{/}" class="btn btn-secondary">Volver al Inicio</a>
        </div>
    </div>
</div>
</body>
</html>
