<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ciclos Menstruales del Paciente</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center">Ciclos Menstruales de <span th:text="${paciente.nombreCompleto}">Paciente</span></h2>

    <div style="text-align: right;">
        <a th:href="@{/}" class="btn btn-secondary">Volver al Inicio</a>
    </div>

    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>Fecha de Inicio</th>
            <th>Duración (días)</th>
            <th>Flujo</th>
            <th>Moco Vaginal</th>
            <th>Síntomas</th>
            <th>Estado de Ánimo</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="ciclo : ${ciclos}">
            <td th:text="${ciclo.primerDiaPeriodo}">Fecha</td>
            <td th:text="${ciclo.duracionCiclo}">Duración</td>
            <td th:text="${ciclo.flujo}">Flujo</td>
            <td th:text="${ciclo.mocoVaginal}">Moco</td>
            <td th:utext="${ciclo.sintomasFormateados}">Síntomas</td>
            <td th:utext="${ciclo.estadoAnimoFormateado}">Ánimo</td>
            <td>
                <a th:href="@{'/ciclos-menstruales/editar/' + ${ciclo.id}}" class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{'/ciclos-menstruales/eliminar/' + ${ciclo.id}}" class="btn btn-sm btn-danger"
                   onclick="return confirm('¿Eliminar este ciclo?');">Eliminar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
