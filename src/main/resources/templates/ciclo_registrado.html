<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ciclo Registrado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>Ciclo Registrado</h2>

    <div class="card p-4">
        <p><strong>Primer Día del Periodo:</strong> <span th:text="${ciclo.primerDiaPeriodo}"></span></p>
        <p><strong>Duración del Ciclo:</strong> <span th:text="${ciclo.duracionCiclo}"></span> días</p>
        <p><strong>Flujo:</strong> <span th:text="${ciclo.flujo}"></span></p>
        <p><strong>Moco Vaginal:</strong> <span th:text="${ciclo.mocoVaginal}"></span></p>

        <p><strong>Síntomas:</strong></p>
        <ul>
            <li th:each="sintoma : ${ciclo.sintomas}" th:text="${sintoma}"></li>
        </ul>

        <p><strong>Estado de Ánimo:</strong></p>
        <ul>
            <li th:each="estado : ${ciclo.estadoAnimo}" th:text="${estado}"></li>
        </ul>
    </div>

    <a href="/" class="btn btn-primary mt-3">Registrar otro ciclo</a>
</div>
</body>
</html>
